# The static pages print a 12-month DST schedule computed at build time.
# Rebuilding monthly keeps that window current. Needs a Vercel Deploy Hook:
#   Vercel → Project → Settings → Git → Deploy Hooks (branch: main) → save the URL as
#   the repo secret VERCEL_DEPLOY_HOOK_URL. Without the secret this workflow does nothing.
name: Monthly rebuild

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_URL not set; skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
